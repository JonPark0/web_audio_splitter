services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-splitter}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-splitter}
      - POSTGRES_DB=${POSTGRES_DB:-splitter}
    # postgres:18 images keep data under a version-specific subdirectory
    # (PGDATA=/var/lib/postgresql/18/docker) and declare the volume at
    # /var/lib/postgresql — mounting the old /var/lib/postgresql/data path
    # would not persist anything.
    volumes:
      - pgdata:/var/lib/postgresql
    # Not published to the host by default (local tool, avoids clashing with
    # a local PostgreSQL). Uncomment to inspect with psql/GUI clients:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        USE_GPU: ${USE_GPU:-false}
        PREFETCH_FLASHSR: ${PREFETCH_FLASHSR:-true}
    ports:
      # The UI reaches the API through the frontend's /api proxy, so the backend
      # only listens on this machine. BACKEND_BIND=0.0.0.0 opens it to the LAN.
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend/media:/app/media
      - demucs_cache:/root/.cache
    environment:
      - USE_GPU=${USE_GPU:-false}
      - DEMUCS_SHIFTS=${DEMUCS_SHIFTS:-0}
      - AUDIOSR_DDIM_STEPS=${AUDIOSR_DDIM_STEPS:-50}
      - AUDIOSR_GUIDANCE_SCALE=${AUDIOSR_GUIDANCE_SCALE:-3.5}
      - AUDIOSR_MODEL_NAME=${AUDIOSR_MODEL_NAME:-basic}
      - MEDIA_RETENTION_DAYS=${MEDIA_RETENTION_DAYS:-0}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-1}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-1024}
      - RENDER_CACHE_MB=${RENDER_CACHE_MB:-4096}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-splitter}:${POSTGRES_PASSWORD:-splitter}@db:5432/${POSTGRES_DB:-splitter}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # prod = static build served by nginx (the default, as in the published
      # image); dev = Vite dev server with the source mounted below
      target: ${FRONTEND_MODE:-prod}
    ports:
      # Open to the LAN: http://<server-LAN-IP>:3000. FRONTEND_BIND=127.0.0.1
      # keeps it to this machine.
      - "${FRONTEND_BIND:-0.0.0.0}:3000:3000"
    volumes:  # used by the dev server only; the prod (nginx) image ignores /app
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  demucs_cache:
  pgdata:
