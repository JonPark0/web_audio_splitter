services:
  backend:
    build:
      context: ./backend
      args:
        USE_GPU: ${USE_GPU:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media
      - demucs_cache:/root/.cache
    environment:
      - USE_GPU=${USE_GPU:-false}
      - DEMUCS_SHIFTS=${DEMUCS_SHIFTS:-0}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  demucs_cache: