# UI tests (e2e/, Playwright) against the real backend on every engine:
# Chromium (desktop, Android tablet/phone), Firefox (desktop) and WebKit
# (desktop Safari, iPad, iPhone). Separation runs through the stand-ins in
# e2e/bin, so no model weights are downloaded. Reports, traces and videos of
# failures are uploaded as artifacts.
name: UI tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Chromium and WebKit each run five device projects: split three ways
      # so a job stays well inside the timeout on a hosted runner.
      matrix:
        include:
          - { browser: chromium, shard: 1/3 }
          - { browser: chromium, shard: 2/3 }
          - { browser: chromium, shard: 3/3 }
          - { browser: firefox, shard: 1/1 }
          - { browser: webkit, shard: 1/3 }
          - { browser: webkit, shard: 2/3 }
          - { browser: webkit, shard: 3/3 }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432
      E2E_BROWSERS: ${{ matrix.browser }}
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: System packages (ffmpeg, libsndfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Backend dependencies (without the ML stack)
        run: pip install -r e2e/requirements.txt

      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Playwright and ${{ matrix.browser }}
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI tests
        working-directory: e2e
        run: npx playwright test --shard=${{ matrix.shard }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
