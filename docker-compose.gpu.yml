services:
  backend:
    build:
      context: ./backend
      args:
        USE_GPU: ${USE_GPU:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media
      - demucs_cache:/root/.cache
    environment:
      - USE_GPU=${USE_GPU:-false}
      - DEMUCS_SHIFTS=${DEMUCS_SHIFTS:-0}
      - AUDIOSR_DDIM_STEPS=${AUDIOSR_DDIM_STEPS:-50}
      - AUDIOSR_GUIDANCE_SCALE=${AUDIOSR_GUIDANCE_SCALE:-3.5}
      - AUDIOSR_MODEL_NAME=${AUDIOSR_MODEL_NAME:-basic}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  demucs_cache: