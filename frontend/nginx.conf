# Production frontend (the published image): serves the Vite build and proxies
# the API to the backend, mirroring the dev server's proxy in vite.config.js:
# /api/<path> goes to the backend as /<path>.

# The backend path, taken from the raw request URI (still percent-encoded,
# query string included) so file names with spaces, '#', '?' or non-ASCII
# characters reach the backend exactly as the browser sent them.
map $request_uri $api_path {
    "~^/api(?<rest>/.*)$" $rest;
    default /;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving per request (proxy_pass with a variable)
    # keeps the proxy working after the backend container is recreated with a
    # new IP, and lets nginx start even while the backend is still down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upload size is enforced by the backend (MAX_UPLOAD_MB); don't cap it here
    # too, or the two limits drift. Stream bodies instead of spooling them.
    client_max_body_size 0;
    proxy_request_buffering off;

    location /api/ {
        proxy_pass http://backend:8000$api_path;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # stems and renders are streamed (StreamingResponse, Range requests)
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed build output: safe to cache for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the app shell. index.html itself is never cached so a
    # new image shows up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
